name: Mobile

# The MAUI app is deliberately outside Splitly.slnx: restoring its Android/iOS targets needs platform workloads that the
# main build (and its Linux runner) doesn't have. It gets its own workflow, and only runs when the app or the API contracts change.
on:
  push:
    branches: [main]
    paths:
      - "src/Splitly.Mobile/**"
      - "src/Splitly.Contracts/**"
      - "src/Splitly.Domain/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "src/Splitly.Mobile/**"
      - "src/Splitly.Contracts/**"
      - "src/Splitly.Domain/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows
      - run: dotnet build src/Splitly.Mobile -c Release -p:SplitlyMobileTargets=net10.0-windows10.0.19041.0

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/Splitly.Mobile -c Release -p:SplitlyMobileTargets=net10.0-android
